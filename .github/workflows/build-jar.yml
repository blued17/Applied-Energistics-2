name: Build AE2 jar v5

on:
  workflow_dispatch:

env:
  RELEASE: 8.4.7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8.0.302'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Download textures
        run: |
          B=https://raw.githubusercontent.com/AppliedEnergistics/Applied-Energistics-2/1.21.1/src/main/resources/assets/ae2/textures/guis
          curl -fL -o src/main/resources/assets/appliedenergistics2/textures/guis/cpu_selector.png $B/cpu_selector.png
          curl -fL -o /tmp/states.png $B/states.png
      - name: Apply CPU list and pin changes
        run: |
          python3 "$(find .github -name cpu.py | head -n 1)"
          python3 "$(find .github -name pins.py | head -n 1)"
      - name: Merge icons
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pillow
          /tmp/venv/bin/python "$(find .github -name icons.py | head -n 1)"
      - name: Save base state
        run: |
          git config user.email ci@example.com
          git config user.name ci
          git add -A
          git commit -q -m "base patches"
      - name: Build with fluids
        id: fluids
        continue-on-error: true
        run: |
          python3 "$(find .github -name fluid.py | head -n 1)"
          mkdir -p build/fg_cache/de/oceanlabs/mcp/mcp_config/1.16.5-20210115.111550
          ./gradlew runData --no-daemon || ./gradlew runData --no-daemon
          ./gradlew assemble --no-daemon
      - name: Upload jar with fluids
        if: steps.fluids.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ae2-jar-fluids
          path: build/libs/*.jar
      - name: Rebuild without fluids
        if: steps.fluids.outcome != 'success'
        run: |
          git reset -q --hard HEAD
          ./gradlew runData --no-daemon || ./gradlew runData --no-daemon
          ./gradlew assemble --no-daemon
      - name: Upload jar without fluids
        if: steps.fluids.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ae2-jar
          path: build/libs/*.jar
