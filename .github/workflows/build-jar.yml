name: Build AE2 jar v3

on:
  workflow_dispatch:

env:
  RELEASE: 8.4.7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8.0.302'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Download textures
        run: |
          B=https://raw.githubusercontent.com/AppliedEnergistics/Applied-Energistics-2/1.21.1/src/main/resources/assets/ae2/textures/guis
          curl -fL -o src/main/resources/assets/appliedenergistics2/textures/guis/cpu_selector.png $B/cpu_selector.png
          curl -fL -o /tmp/states.png $B/states.png
          curl -fL -o /tmp/terminal.png $B/terminal.png
      - name: Apply CPU list changes
        run: |
          python3 - <<'PY'
          import re
          # ---------- 1. version + cluster getter + lang + status json (idempotent) ----------
          p = 'src/main/java/appeng/me/cluster/implementations/CraftingCPUCluster.java'
          s = open(p).read()
          if 'getFinalOutput' not in s:
              s = s.replace("    public long getElapsedTime() {",
                  "    public IAEItemStack getFinalOutput() {\n        return this.finalOutput != null ? this.finalOutput.copy() : null;\n    }\n\n    public long getElapsedTime() {", 1)
              assert 'getFinalOutput' in s
              open(p, 'w').write(s)

          p = 'src/main/resources/assets/appliedenergistics2/lang/en_us.json'
          s = open(p).read().rstrip()
          if 'CpuStatusStorage' not in s:
              body = s[:-1].rstrip()
              add = ''',
            "gui.appliedenergistics2.CraftingCPUs": "Crafting CPUs",
            "gui.appliedenergistics2.CpuStatusCoProcessor": "%s Co-Processor",
            "gui.appliedenergistics2.CpuStatusCoProcessors": "%s Co-Processors",
            "gui.appliedenergistics2.CpuStatusStorage": "%s Storage",
            "gui.appliedenergistics2.CpuStatusCrafting": "Crafting: %s",
            "gui.appliedenergistics2.CpuStatusCraftedIn": "%s done after %s"
          }
          '''
              open(p, 'w').write(body + add)

          p = 'src/main/resources/assets/appliedenergistics2/screens/crafting_status.json'
          open(p, 'w').write('''{
            "$schema": "schema.json",
            "includes": ["crafting_cpu.json"],
            "widgets": {
              "back": {"left": 213, "top": -4, "hideEdge": true},
              "selectCpuList": {"left": -88, "top": 0, "width": 94, "height": 164},
              "selectCpuScrollbar": {"left": -11, "top": 19, "width": 12, "height": 137}
            }
          }
          ''')

          # ---------- 2. widget: icons from the selector texture + explicit button colors ----------
          p = 'src/main/java/appeng/client/gui/widgets/CPUSelectionList.java'
          s = open(p).read()
          if 'drawButton(' not in s:
              def rep(old, new):
                  global s
                  assert s.count(old) == 1, 'patch anchor not found exactly once: ' + old
                  s = s.replace(old, new)
              rep('ICON_TEXTURE = "guis/cpu_icons.png"', 'ICON_TEXTURE = "guis/cpu_selector.png"')
              rep('icon(208, 224)', 'icon(100, 50)')
              rep('icon(208, 234)', 'icon(112, 50)')
              rep('icon(208, 244)', 'icon(124, 50)')
              rep('button(selected).dest(x, y).blit(matrices, zIndex);', 'drawButton(matrices, x, y, selected);')
              rep('selected ? PROGRESS_COLOR_SELECTED : PROGRESS_COLOR', 'selected ? 0xFF3A78B8 : 0xFF9CD3FF')
              rep('    private void drawScaledText(', '''    private static void drawButton(MatrixStack matrices, int x, int y, boolean selected) {
                  int shade = selected ? 0xFF708CBA : 0xFF4D4D67;
                  int light = selected ? 0xFFDAFFFF : 0xFF9A9FB4;
                  int body = selected ? 0xFF9CD3FF : 0xFF878FA5;
                  AbstractGui.fill(matrices, x, y, x + BUTTON_WIDTH, y + BUTTON_HEIGHT, shade);
                  AbstractGui.fill(matrices, x, y, x + BUTTON_WIDTH - 1, y + BUTTON_HEIGHT - 1, light);
                  AbstractGui.fill(matrices, x + 1, y + 1, x + BUTTON_WIDTH - 1, y + BUTTON_HEIGHT - 1, body);
              }

              private void drawScaledText(''')
              open(p, 'w').write(s)
          PY
      - name: Apply pin changes
        run: |
          python3 - <<'PY'
          # ===== Pinned crafting row (client side) =====
          base = 'src/main/java/appeng/client/gui/me/'

          def edit(path, pairs):
              s = open(base + path).read()
              if 'PinnedStacks' in s:
                  return
              for old, new, count in pairs:
                  assert s.count(old) == count, 'anchor not found %d time(s) in %s: %s' % (count, path, old)
                  s = s.replace(old, new)
              open(base + path, 'w').write(s)

          open(base + 'common/PinnedStacks.java', 'w').write('''package appeng.client.gui.me.common;

          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;

          import appeng.api.storage.data.IAEStack;

          /**
           * Client-side list of stacks that are pinned to the first row of the terminal while they are being crafted.
           */
          public final class PinnedStacks {

              public static final int MAX_PINNED = 9;
              private static final long MAX_AGE_MS = 30L * 60L * 1000L;

              private static final List<Pin> PINS = new ArrayList<>();
              private static IAEStack<?> pending;

              private static final class Pin {
                  final IAEStack<?> stack;
                  long since = System.currentTimeMillis();
                  boolean canPrune;

                  Pin(IAEStack<?> stack) {
                      this.stack = stack;
                  }
              }

              private PinnedStacks() {
              }

              public static boolean isEmpty() {
                  return PINS.isEmpty();
              }

              public static boolean isPinned(IAEStack<?> stack) {
                  return find(stack) != null;
              }

              public static long getPinTime(IAEStack<?> stack) {
                  Pin pin = find(stack);
                  return pin != null ? pin.since : Long.MAX_VALUE;
              }

              private static Pin find(IAEStack<?> stack) {
                  if (stack == null) {
                      return null;
                  }
                  for (Pin pin : PINS) {
                      if (pin.stack.equals(stack)) {
                          return pin;
                      }
                  }
                  return null;
              }

              public static void pin(IAEStack<?> stack) {
                  if (stack == null) {
                      return;
                  }
                  Pin existing = find(stack);
                  if (existing != null) {
                      existing.since = System.currentTimeMillis();
                      existing.canPrune = false;
                      return;
                  }
                  PINS.add(new Pin(stack.copy()));
                  while (PINS.size() > MAX_PINNED) {
                      Pin oldest = PINS.get(0);
                      for (Pin pin : PINS) {
                          if (pin.since < oldest.since) {
                              oldest = pin;
                          }
                      }
                      PINS.remove(oldest);
                  }
              }

              /**
               * Remembers what the player asked to craft in the terminal.
               */
              public static void setPendingRequest(IAEStack<?> stack) {
                  if (stack == null) {
                      pending = null;
                  } else {
                      pending = stack.copy();
                  }
              }

              /**
               * Called when a crafting job is started: pins what the player last asked to craft.
               */
              public static void pinPendingRequest() {
                  if (pending != null) {
                      pin(pending);
                      pending = null;
                  }
              }

              /**
               * Flags all pins for removal the next time a terminal is opened.
               */
              public static void markPrunable() {
                  for (Pin pin : PINS) {
                      pin.canPrune = true;
                  }
              }

              public static void prune() {
                  long now = System.currentTimeMillis();
                  Iterator<Pin> it = PINS.iterator();
                  while (it.hasNext()) {
                      Pin pin = it.next();
                      if (pin.canPrune || now - pin.since > MAX_AGE_MS) {
                          it.remove();
                      }
                  }
              }

          }
          ''')

          edit('common/Repo.java', [
              ('    private final ArrayList<GridInventoryEntry<T>> view = new ArrayList<>();\n',
               '    private final ArrayList<GridInventoryEntry<T>> view = new ArrayList<>();\n'
               '    private final ArrayList<GridInventoryEntry<T>> pinnedRow = new ArrayList<>();\n', 1),
              ('        this.view.sort(Comparator.comparing(GridInventoryEntry::getStack, getComparator(sortOrder, sortDir)));\n',
               '        this.view.sort(Comparator.comparing(GridInventoryEntry::getStack, getComparator(sortOrder, sortDir)));\n'
               '\n'
               '        // Pinned entries ignore the search and are shown in a fixed first row\n'
               '        this.pinnedRow.clear();\n'
               '        if (!PinnedStacks.isEmpty()) {\n'
               '            ArrayList<GridInventoryEntry<T>> found = new ArrayList<>();\n'
               '            for (GridInventoryEntry<T> entry : this.entries.values()) {\n'
               '                if (PinnedStacks.isPinned(entry.getStack())\n'
               '                        && (this.partitionList == null || this.partitionList.isListed(entry.getStack()))) {\n'
               '                    found.add(entry);\n'
               '                }\n'
               '            }\n'
               '            found.sort((a, b) -> Long.compare(PinnedStacks.getPinTime(a.getStack()),\n'
               '                    PinnedStacks.getPinTime(b.getStack())));\n'
               '            for (GridInventoryEntry<T> entry : found) {\n'
               '                if (this.pinnedRow.size() < this.rowSize) {\n'
               '                    this.pinnedRow.add(entry);\n'
               '                }\n'
               '            }\n'
               '            this.view.removeAll(this.pinnedRow);\n'
               '        }\n', 1),
              ('        idx += this.src.getCurrentScroll() * this.rowSize;\n',
               '        if (!this.pinnedRow.isEmpty()) {\n'
               '            if (idx < this.rowSize) {\n'
               '                return idx < this.pinnedRow.size() ? this.pinnedRow.get(idx) : null;\n'
               '            }\n'
               '            idx -= this.rowSize;\n'
               '        }\n'
               '        idx += this.src.getCurrentScroll() * this.rowSize;\n', 1),
              ('        return this.view.size();\n',
               '        return this.view.size() + (this.pinnedRow.isEmpty() ? 0 : this.rowSize);\n', 1),
              ('        this.entries.clear();\n        this.view.clear();\n',
               '        this.entries.clear();\n        this.view.clear();\n        this.pinnedRow.clear();\n', 1),
              ('    public final boolean hasPower() {',
               '    public final boolean hasPinnedRow() {\n        return !this.pinnedRow.isEmpty();\n    }\n\n    public final boolean hasPower() {', 1),
          ])

          edit('common/MEMonitorableScreen.java', [
              ('        getMinecraft().keyboardListener.enableRepeatEvents(true);\n',
               '        PinnedStacks.prune();\n        getMinecraft().keyboardListener.enableRepeatEvents(true);\n', 1),
              ('        memoryText = this.searchField.getText();\n',
               '        memoryText = this.searchField.getText();\n'
               '        if (this.container.activeCraftingJobs == 0) {\n'
               '            PinnedStacks.markPrunable();\n'
               '        }\n', 1),
              ('        style.getBottom().dest(offsetX, y).blit(matrixStack, getBlitOffset());\n',
               '        style.getBottom().dest(offsetX, y).blit(matrixStack, getBlitOffset());\n'
               '\n'
               '        // Decoration for the pinned row\n'
               '        if (this.repo.hasPinnedRow()) {\n'
               '            Blitter.texture("guis/cpu_selector.png", 256, 256)\n'
               '                    .src(94, 70, 162, 18)\n'
               '                    .dest(offsetX + 7, offsetY + style.getHeader().getSrcHeight())\n'
               '                    .blit(matrixStack, getBlitOffset());\n'
               '        }\n', 1),
          ])

          edit('items/ItemTerminalScreen.java', [
              ('package appeng.client.gui.me.items;\n',
               'package appeng.client.gui.me.items;\n\nimport appeng.client.gui.me.common.PinnedStacks;\n', 1),
              ('container.handleInteraction(serial, InventoryAction.AUTO_CRAFT);',
               'PinnedStacks.setPendingRequest(entry.getStack());\n                        container.handleInteraction(serial, InventoryAction.AUTO_CRAFT);', 2),
          ])

          edit('crafting/CraftConfirmScreen.java', [
              ('package appeng.client.gui.me.crafting;\n',
               'package appeng.client.gui.me.crafting;\n\nimport appeng.client.gui.me.common.PinnedStacks;\n', 1),
              ('        NetworkHandler.instance().sendToServer(new ConfigValuePacket("Terminal.Start", "Start"));',
               '        PinnedStacks.pinPendingRequest();\n        NetworkHandler.instance().sendToServer(new ConfigValuePacket("Terminal.Start", "Start"));', 1),
          ])

          edit('crafting/CraftAmountScreen.java', [
              ('package appeng.client.gui.me.crafting;\n',
               'package appeng.client.gui.me.crafting;\n\nimport appeng.client.gui.me.common.PinnedStacks;\n', 1),
              ('        container.confirm(amount, hasShiftDown());',
               '        if (hasShiftDown()) {\n            PinnedStacks.pinPendingRequest();\n        }\n        container.confirm(amount, hasShiftDown());', 1),
          ])
          print('pins applied')
          PY
      - name: Merge icons
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pillow
          /tmp/venv/bin/python - <<'PY'
          from PIL import Image
          D = 'src/main/resources/assets/appliedenergistics2/textures/guis/'
          sel = Image.open(D + 'cpu_selector.png').convert('RGBA')
          states = Image.open('/tmp/states.png').convert('RGBA')
          terminal = Image.open('/tmp/terminal.png').convert('RGBA')
          T = 0.3
          def dark(img):
              px = img.load()
              for yy in range(img.height):
                  for xx in range(img.width):
                      r, g, b, a = px[xx, yy]
                      px[xx, yy] = (int(r * T), int(g * T), int(b * T), a)
              return img
          for (sx, sy), (dx, dy) in [((208, 224), (100, 50)), ((208, 234), (112, 50)), ((208, 244), (124, 50))]:
              sel.paste(dark(states.crop((sx, sy, sx + 10, sy + 10))), (dx, dy))
          sel.paste(terminal.crop((0, 204, 162, 222)), (94, 70))
          sel.save(D + 'cpu_selector.png')
          print('icons merged')
          PY
      - name: Generate assets
        run: mkdir -p build/fg_cache/de/oceanlabs/mcp/mcp_config/1.16.5-20210115.111550 && ./gradlew runData --no-daemon || ./gradlew runData --no-daemon
      - name: Build with Gradle
        run: ./gradlew assemble --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ae2-jar
          path: build/libs/*.jar
